# Development / integration only. NOT hardened for production.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ${AURA_POSTGRES_PASSWORD:?Set AURA_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aura-postgres:/var/lib/postgresql/data
  api:
    build: .
    environment:
      AURA_ENV: production
      AURA_SECRET_KEY: ${AURA_SECRET_KEY:?Set unique AURA_SECRET_KEY}
      AURA_DATABASE_URL: postgresql+psycopg://aura:${AURA_POSTGRES_PASSWORD}@db:5432/aura
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  aura-postgres:
